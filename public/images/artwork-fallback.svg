<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e44735" />
      <stop offset="100%" stop-color="#f2c14e" />
    </linearGradient>
  </defs>

  <!-- Deep ink background -->
  <rect width="600" height="900" fill="url(#bgGrad)" />

  <!-- Outer comic border -->
  <rect x="24" y="24" width="552" height="852" rx="12" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Comic Panel Grid Layout Wireframe -->
  <rect x="44" y="44" width="512" height="380" rx="8" fill="#1c1c20" stroke="#3f3f46" stroke-width="2" />
  <rect x="44" y="444" width="246" height="300" rx="8" fill="#1c1c20" stroke="#3f3f46" stroke-width="2" />
  <rect x="310" y="444" width="246" height="300" rx="8" fill="#1c1c20" stroke="#3f3f46" stroke-width="2" />

  <!-- Dynamic panel slash line (PageProwl accent) -->
  <line x1="44" y1="424" x2="556" y2="424" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Center Artwork Icon & Badge -->
  <circle cx="300" cy="234" r="54" fill="#27272a" stroke="#52525b" stroke-width="2" />
  <!-- Comic book / photo placeholder icon -->
  <path d="M280 216 L320 216 M280 234 L320 234 M280 252 L306 252" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
  <rect x="274" y="204" width="52" height="60" rx="4" fill="none" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- PageProwl Branding & Label -->
  <text x="300" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f4f4f5" text-anchor="middle" letter-spacing="0.05em">
    PAGEPROWL
  </text>
  <text x="300" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#71717a" text-anchor="middle">
    Artwork In Production
  </text>

  <!-- Bottom panel accents -->
  <rect x="64" y="464" width="70" height="8" rx="4" fill="#27272a" />
  <rect x="64" y="482" width="110" height="6" rx="3" fill="#27272a" />
  <rect x="330" y="464" width="70" height="8" rx="4" fill="#27272a" />
  <rect x="330" y="482" width="110" height="6" rx="3" fill="#27272a" />

  <!-- Footer Tagline -->
  <text x="300" y="800" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#52525b" text-anchor="middle" letter-spacing="0.1em">
    ORIGINAL INDIE COMIC PUBLISHING
  </text>
</svg>
